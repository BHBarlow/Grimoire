<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grimoire</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --border: #262b36;
    --fg: #e6e8ee; --muted: #8b93a7; --accent: #c9a45c; --mark: #ffd86b;
    --btn: #222835;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header { padding: 40px 20px 8px; text-align: center; }
  h1 { margin: 0 0 4px; font-weight: 600; letter-spacing: .5px; }
  h1 .g { color: var(--accent); }
  .tagline { color: var(--muted); font-size: 14px; }
  .wrap { max-width: 820px; margin: 0 auto; padding: 0 20px 60px; }

  .tabs { display: flex; justify-content: center; gap: 8px; margin: 20px 0 4px; }
  .tab {
    background: none; border: none; color: var(--muted); cursor: pointer;
    font-size: 14px; padding: 8px 14px; border-radius: 8px;
  }
  .tab.active { color: var(--fg); background: var(--panel); }
  .tab:hover { color: var(--fg); }

  .view { display: none; }
  .view.active { display: block; }

  .toolbar { display: flex; gap: 8px; margin: 20px 0 8px; }
  input[type=search], input[type=text] {
    flex: 1; padding: 14px 16px; font-size: 16px; color: var(--fg);
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
  }
  input:focus { outline: none; border-color: var(--accent); }
  select, button.action {
    background: var(--panel); color: var(--fg); border: 1px solid var(--border);
    border-radius: 10px; padding: 0 12px; font-size: 14px; cursor: pointer;
  }
  button.action:hover:not(:disabled) { border-color: var(--accent); }
  button.action:disabled { opacity: .5; cursor: default; }
  button.action.active { border-color: var(--accent); color: var(--accent); }
  .status { color: var(--muted); font-size: 13px; min-height: 18px; }

  /* search results — one collapsible group per book */
  .bookgroup {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; margin: 10px 0; overflow: hidden;
  }
  .bookgroup > summary {
    display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
    padding: 14px 16px; cursor: pointer; list-style: none; user-select: none;
  }
  .bookgroup > summary::-webkit-details-marker { display: none; }
  .bookgroup > summary::before {
    content: '▸'; color: var(--muted); margin-right: 8px; font-size: 12px;
    transition: transform .15s ease; display: inline-block;
  }
  .bookgroup[open] > summary::before { transform: rotate(90deg); }
  .bookgroup > summary:hover { background: rgba(255,255,255,.02); }
  .bookgroup > summary .title { font-weight: 600; flex: 1; }
  .bookgroup > summary .count {
    color: var(--muted); font-size: 12px; white-space: nowrap;
    border: 1px solid var(--border); border-radius: 999px; padding: 1px 9px;
  }
  .hits { border-top: 1px solid var(--border); }
  .hit {
    display: block; text-decoration: none; color: inherit;
    padding: 10px 16px 12px 34px; border-bottom: 1px solid var(--border);
  }
  .hit:last-child { border-bottom: none; }
  .hit:hover { background: rgba(201,164,92,.06); }
  .hitloc { color: var(--accent); font-size: 12px; }
  .hitlabel { color: var(--muted); }
  .excerpt { color: #c4c9d6; font-size: 14px; margin-top: 6px; }
  .excerpt mark { background: transparent; color: var(--mark); font-weight: 600; }

  /* shared button */
  .btn {
    text-decoration: none; font-size: 12px; padding: 6px 11px; border-radius: 8px;
    border: 1px solid var(--border); color: var(--fg); background: var(--btn);
    white-space: nowrap;
  }
  .btn:hover { border-color: var(--accent); }

  /* result header right-side (count + open button) */
  .bookgroup > summary .right { display: flex; align-items: center; gap: 10px; }

  /* library grid */
  .grid {
    display: grid; gap: 18px; margin-top: 8px;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  }
  .card {
    position: relative;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; overflow: hidden; display: flex; flex-direction: column;
  }
  .card .check {
    position: absolute; top: 8px; left: 8px; z-index: 3;
    width: 24px; height: 24px; border-radius: 6px;
    border: 2px solid #fff; background: rgba(0,0,0,.55);
    display: none; align-items: center; justify-content: center;
    color: #fff; font-size: 15px; line-height: 1;
  }
  .grid.selecting .card { cursor: pointer; }
  .grid.selecting .card .check { display: flex; }
  .card.selected { outline: 2px solid var(--accent); outline-offset: -2px; }
  .card.selected .check { background: var(--accent); border-color: var(--accent); color: #141414; }

  .selectbar {
    display: flex; align-items: center; gap: 12px; margin: 4px 0;
    padding: 8px 14px; background: var(--panel);
    border: 1px solid var(--border); border-radius: 10px; font-size: 13px;
  }
  .selectbar .spacer { flex: 1; }
  .action.danger { border-color: #7a2b2b; color: #ff9d9d; }
  .action.danger:hover:not(:disabled) { border-color: #c0392b; background: #2a1414; }
  .card .coverwrap {
    position: relative; display: block; aspect-ratio: 1 / 1.5;
    background: #0c0e12; overflow: hidden;
  }
  .card .coverwrap img {
    position: relative; width: 100%; height: 100%; object-fit: cover; display: block;
  }
  .card .fallback {
    position: absolute; inset: 0; display: flex; align-items: center;
    justify-content: center; text-align: center; padding: 12px;
    color: var(--muted); font-weight: 600; font-size: 13px; line-height: 1.3;
  }
  .card .fmtbadge {
    position: absolute; top: 6px; right: 6px; z-index: 2;
    font-size: 9px; text-transform: uppercase; letter-spacing: .5px; color: #e6e8ee;
    background: rgba(0,0,0,.6); border-radius: 4px; padding: 2px 6px;
  }
  .card .info { padding: 9px 11px 4px; flex: 1; }
  .card .info .t {
    font-size: 13px; font-weight: 600; line-height: 1.25;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .card .info .a {
    font-size: 11px; color: var(--muted); margin-top: 3px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .card .acts { display: flex; gap: 6px; padding: 9px 11px 11px; }
  .card .acts .btn { flex: 1; text-align: center; }

  .badge {
    font-size: 10px; text-transform: uppercase; letter-spacing: .5px;
    color: var(--muted); border: 1px solid var(--border); border-radius: 4px;
    padding: 1px 5px; margin-left: 8px;
  }
  footer { text-align: center; color: var(--muted); font-size: 12px; padding-bottom: 30px; }
  footer a { color: var(--muted); }
</style>
</head>
<body>
  <header>
    <h1><span class="g">📖</span> Grimoire</h1>
    <div class="tagline">Search <em>inside</em> your books.</div>
  </header>

  <div class="wrap">
    <div class="tabs">
      <button class="tab active" data-view="search">Search inside</button>
      <button class="tab" data-view="library">Library</button>
    </div>

    <!-- SEARCH INSIDE -->
    <section class="view active" id="view-search">
      <div class="toolbar">
        <input id="q" type="search" placeholder="e.g. iptables NAT" autocomplete="off">
      </div>
      <div class="status" id="searchStatus">Full-text search across every page of your PDFs. Ranked by relevance (BM25).</div>
      <div id="results"></div>
    </section>

    <!-- LIBRARY -->
    <section class="view" id="view-library">
      <div class="toolbar">
        <input id="titleFilter" type="text" placeholder="Filter by title or author…" autocomplete="off">
        <select id="libFormat" title="Filter by format">
          <option value="">All formats</option>
          <option value="pdf">PDF</option>
          <option value="epub">EPUB</option>
        </select>
        <button class="action" id="uploadBtn" title="Add a PDF or EPUB">↑ Upload</button>
        <button class="action" id="selectBtn" title="Select books to delete">Select</button>
        <button class="action" id="reindexBtn" title="Scan the books folder for new/changed files">↻ Reindex</button>
        <input id="fileInput" type="file" accept=".pdf,.epub" multiple hidden>
      </div>
      <div class="selectbar" id="selectBar" hidden>
        <span id="selCount">0 selected</span>
        <span class="spacer"></span>
        <button class="action danger" id="deleteBtn" disabled>Delete selected</button>
      </div>
      <div class="status" id="libStatus">Loading…</div>
      <div id="books"></div>
    </section>
  </div>

  <footer>
    <a href="/opds">OPDS feed</a> · <a href="/docs">API docs</a>
  </footer>

<script>
// ---------------------------------------------------------------- tab switching
const views = { search: 'view-search', library: 'view-library' };
let libraryLoaded = false;
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById(views[tab.dataset.view]).classList.add('active');
    if (tab.dataset.view === 'library' && !libraryLoaded) loadLibrary();
  });
});

function escapeHtml(s) {
  return String(s).replace(/[&<>"]/g, c => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]
  ));
}

// Excerpt arrives with \x02 / \x03 wrapping matched terms. Escape raw book text
// first, then turn the sentinels into <mark> so stray < > can't inject markup.
function highlight(excerpt) {
  if (!excerpt) return '';
  const OPEN = String.fromCharCode(2), CLOSE = String.fromCharCode(3);
  return escapeHtml(excerpt).replaceAll(OPEN, '<mark>').replaceAll(CLOSE, '</mark>');
}

function pdfViewerHref(id) {
  return `/pdfjs/web/viewer.html?file=${encodeURIComponent('/download/' + id)}`;
}

// ---------------------------------------------------------------- search inside
const qEl = document.getElementById('q');
const searchStatusEl = document.getElementById('searchStatus');
const resultsEl = document.getElementById('results');

let timer = null;
const debounce = (fn, ms) => (...a) => { clearTimeout(timer); timer = setTimeout(() => fn(...a), ms); };

async function runSearch() {
  const q = qEl.value.trim();
  resultsEl.innerHTML = '';
  if (!q) { searchStatusEl.textContent = 'Full-text search across every page of your PDFs. Ranked by relevance (BM25).'; return; }
  searchStatusEl.textContent = 'Searching…';

  let data;
  try {
    const res = await fetch('/search?q=' + encodeURIComponent(q) + '&limit=500');
    data = await res.json();
  } catch (e) { searchStatusEl.textContent = 'Search failed: ' + e; return; }

  const books = data.books || [];
  searchStatusEl.textContent = data.total_hits
    ? `${data.total_hits} hit${data.total_hits === 1 ? '' : 's'} in ${data.book_count} book${data.book_count === 1 ? '' : 's'} for "${q}"`
    : `No hits for "${q}".`;

  books.forEach((b, i) => {
    const group = document.createElement('details');
    group.className = 'bookgroup';
    if (i === 0) group.open = true;  // expand the most relevant book by default

    const openUrl = pdfViewerHref(b.book_id);  // search hits are always PDFs
    const hits = b.hits.map(h => `
      <a class="hit" href="${openUrl}#page=${h.page}" target="_blank" rel="noopener">
        <div class="hitloc">p. ${h.page}${h.label ? ` · <span class="hitlabel">${escapeHtml(h.label)}</span>` : ''}</div>
        <div class="excerpt">${highlight(h.excerpt)}</div>
      </a>`).join('');

    group.innerHTML = `
      <summary>
        <span class="title">${escapeHtml(b.title || 'Untitled')}</span>
        <span class="right">
          <span class="count">${b.hit_count} hit${b.hit_count === 1 ? '' : 's'}</span>
          <a class="btn openbtn" href="${openUrl}" target="_blank" rel="noopener">Open PDF ↗</a>
        </span>
      </summary>
      <div class="hits">${hits}</div>`;

    // Opening the PDF must not also toggle the dropdown.
    group.querySelector('.openbtn').addEventListener('click', e => {
      e.preventDefault();
      e.stopPropagation();
      window.open(openUrl, '_blank', 'noopener');
    });
    resultsEl.appendChild(group);
  });
}
qEl.addEventListener('input', debounce(runSearch, 200));

// ---------------------------------------------------------------------- library
const titleFilterEl = document.getElementById('titleFilter');
const libFormatEl = document.getElementById('libFormat');
const libStatusEl = document.getElementById('libStatus');
const booksEl = document.getElementById('books');
const reindexBtn = document.getElementById('reindexBtn');
const uploadBtn = document.getElementById('uploadBtn');
const fileInput = document.getElementById('fileInput');
const selectBtn = document.getElementById('selectBtn');
const selectBar = document.getElementById('selectBar');
const selCount = document.getElementById('selCount');
const deleteBtn = document.getElementById('deleteBtn');
let allBooks = [];
let selectMode = false;
const selected = new Set();

async function loadLibrary() {
  libStatusEl.textContent = 'Loading…';
  try {
    const res = await fetch('/books');
    const data = await res.json();
    allBooks = data.books.sort((a, b) =>
      (a.title || '').localeCompare(b.title || '') || a.format.localeCompare(b.format));
    libraryLoaded = true;
    selected.clear();
    updateSelectBar();
    renderLibrary();
  } catch (e) { libStatusEl.textContent = 'Failed to load library: ' + e; }
}

function renderLibrary() {
  const q = titleFilterEl.value.trim().toLowerCase();
  const fmt = libFormatEl.value;
  const shown = allBooks.filter(b =>
    (!fmt || b.format === fmt) &&
    (!q || (b.title || '').toLowerCase().includes(q) || (b.author || '').toLowerCase().includes(q)));

  booksEl.className = 'grid' + (selectMode ? ' selecting' : '');
  booksEl.innerHTML = '';
  libStatusEl.textContent = `${shown.length} of ${allBooks.length} book${allBooks.length === 1 ? '' : 's'}`;

  for (const b of shown) {
    const card = document.createElement('div');
    card.className = 'card' + (selected.has(b.id) ? ' selected' : '');
    const openUrl = b.format === 'pdf' ? pdfViewerHref(b.id) : `/download/${b.id}`;
    // Only PDFs have an in-browser reader; EPUBs are download-only.
    const read = b.format === 'pdf'
      ? `<a class="btn" href="${pdfViewerHref(b.id)}" target="_blank" rel="noopener">Read</a>`
      : '';
    card.innerHTML = `
      <div class="check">✓</div>
      <a class="coverwrap" href="${openUrl}" target="_blank" rel="noopener" title="${escapeHtml(b.title || 'Untitled')}">
        <div class="fallback">${escapeHtml(b.title || 'Untitled')}</div>
        <img src="/cover/${b.id}" alt="" loading="lazy" onerror="this.remove()">
        <span class="fmtbadge">${b.format}</span>
      </a>
      <div class="info">
        <div class="t" title="${escapeHtml(b.title || 'Untitled')}">${escapeHtml(b.title || 'Untitled')}</div>
        <div class="a">${escapeHtml(b.author || 'Unknown author')}</div>
      </div>
      <div class="acts">
        ${read}
        <a class="btn" href="/download/${b.id}" download>Download</a>
      </div>`;
    // In select mode, a click anywhere on the card toggles selection (and
    // cancels the link navigation via preventDefault); normal mode = links work.
    card.addEventListener('click', e => {
      if (!selectMode) return;
      e.preventDefault();
      if (selected.has(b.id)) { selected.delete(b.id); card.classList.remove('selected'); }
      else { selected.add(b.id); card.classList.add('selected'); }
      updateSelectBar();
    });
    booksEl.appendChild(card);
  }
}
titleFilterEl.addEventListener('input', debounce(renderLibrary, 100));
libFormatEl.addEventListener('change', renderLibrary);

// ---- select / delete ----
function updateSelectBar() {
  selCount.textContent = `${selected.size} selected`;
  deleteBtn.disabled = selected.size === 0;
}

selectBtn.addEventListener('click', () => {
  selectMode = !selectMode;
  if (!selectMode) selected.clear();
  selectBtn.textContent = selectMode ? 'Done' : 'Select';
  selectBtn.classList.toggle('active', selectMode);
  selectBar.hidden = !selectMode;
  updateSelectBar();
  renderLibrary();
});

deleteBtn.addEventListener('click', async () => {
  const ids = [...selected];
  if (!ids.length) return;
  const msg = `Delete ${ids.length} book${ids.length === 1 ? '' : 's'}? ` +
    `This permanently removes the file${ids.length === 1 ? '' : 's'} from disk.`;
  if (!confirm(msg)) return;

  deleteBtn.disabled = true;
  libStatusEl.textContent = 'Deleting…';
  let ok = 0, fail = 0;
  for (const id of ids) {
    try { (await fetch('/book/' + id, { method: 'DELETE' })).ok ? ok++ : fail++; }
    catch { fail++; }
  }
  libStatusEl.textContent = `Deleted ${ok}${fail ? `, ${fail} failed` : ''}.`;
  await loadLibrary();  // clears selection + re-renders
});

// ---- upload ----
uploadBtn.addEventListener('click', () => fileInput.click());

fileInput.addEventListener('change', async () => {
  const files = [...fileInput.files];
  fileInput.value = '';  // allow re-selecting the same file later
  if (!files.length) return;

  uploadBtn.disabled = true;
  let ok = 0;
  const errs = [];
  for (const f of files) {
    libStatusEl.textContent = `Uploading ${f.name}…`;
    const fd = new FormData();
    fd.append('file', f);
    try {
      const res = await fetch('/upload', { method: 'POST', body: fd });
      if (res.ok) { ok++; }
      else { const e = await res.json().catch(() => ({})); errs.push(`${f.name}: ${e.detail || res.status}`); }
    } catch (err) { errs.push(`${f.name}: ${err}`); }
  }
  uploadBtn.disabled = false;
  libStatusEl.textContent = errs.length
    ? `Uploaded ${ok}, ${errs.length} failed — ${errs[0]}`
    : `Uploaded ${ok} file${ok === 1 ? '' : 's'}.`;
  await loadLibrary();
});

reindexBtn.addEventListener('click', async () => {
  reindexBtn.disabled = true;
  const original = reindexBtn.textContent;
  reindexBtn.textContent = 'Reindexing…';
  libStatusEl.textContent = 'Scanning the books folder…';
  try {
    const res = await fetch('/reindex', { method: 'POST' });
    const s = await res.json();
    libStatusEl.textContent =
      `Done: ${s.indexed} indexed, ${s.skipped} unchanged, ${s.removed} removed, ${s.failed} failed.`;
    await loadLibrary();
  } catch (e) {
    libStatusEl.textContent = 'Reindex failed: ' + e;
  } finally {
    reindexBtn.disabled = false;
    reindexBtn.textContent = original;
  }
});
</script>
</body>
</html>
